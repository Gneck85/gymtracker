// Cómo te fue con el peso (se guarda como "<id>~fb" en la Sheet)

// ===== RUTINA (desde 9/11/2026) =====
// ss = letra de superserie: los ejercicios con la misma letra se hacen uno atrás del otro.
const RUTINA = {

  },

    bloques: [
      { nombre: "Principal · 90 seg", ejercicios: [

      ]},
      { nombre: "Superserie A · 75 seg", ejercicios: [
        { id: "E2", nombre: "Remo a 1 brazo con mancuerna", series: 3, reps: "10 c/lado", pesoRef: "16 kg", ss: "A", zona: "espalda", suave: { series: 3, reps: "12 c/lado lentas", pesoRef: "10 kg" } },
        { id: "E3", nombre: "Tríceps en polea con barra V", series: 3, reps: "12 reps", pesoRef: "15 kg", ss: "A" },
      ]},
      { nombre: "Superserie B · 75 seg", ejercicios: [
        { id: "E4", nombre: "Remo sentado en máquina", series: 3, reps: "10 reps", pesoRef: "35 kg", ss: "B", zona: "espalda", suave: { series: 3, reps: "12 reps lentas", pesoRef: "25 kg" } },

      ]},

const DIAS = ["Lunes", "Miercoles", "Viernes"];
const DIAS_LABEL = { Lunes: "Día 1", Miercoles: "Día 2", Viernes: "Día 3" };

let allWeeks = [];
let sesionesCache = {};
let currentWeek = "";
let semanaActiva = "";
let diaActivo = "Lunes";
let vista = "rutina";
let pendientes = 0;
let saveChain = Promise.resolve();

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function getWeekKey() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, "0")}`;
}

function formatWeekLabel(key) {
  try {
    const [year, weekPart] = key.split("-W");
    const week = parseInt(weekPart);
    const jan4 = new Date(parseInt(year), 0, 4);
    const s = new Date(jan4);
    s.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (week - 1) * 7);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    const fmt = d => d.toLocaleDateString("es-AR", { day: "numeric", month: "short" });
    return `${fmt(s)} – ${fmt(e)}`;
  } catch { return key; }
}

// Cuántas sesiones con algún ejercicio de la zona tildado hiciste en [desde, antes de week)
function sesionesDeZona(zona, desde, week) {
  let n = 0;
  allWeeks.filter(w => w >= desde && w < week).forEach(w => DIAS.forEach(d => {
    const hizo = RUTINA[d].bloques.some(b => b.ejercicios.some(e => e.zona === zona && getCheck(w, d, e.id)));
    if (hizo) n++;
  }));
  return n;
}

function cuidadoDe(week, ej) {
  if (!ej.zona) return null;
  return PAUSAS.find(p => {
    if (p.zona !== ej.zona) return false;
    if (p.semana) return p.semana === week;
    return week >= p.desde && sesionesDeZona(p.zona, p.desde, week) < (p.sesiones || 1);
  }) || null;
}

// Devuelve el cuidado solo si ese ejercicio queda pausado esa semana
function pausaDe(week, ej) {
  const c = cuidadoDe(week, ej);
  if (!c) return null;
  if (c.tipo === "suave" && ej.suave !== "pausa") return null;
  return c;
}

// Devuelve la versión suave del ejercicio si corresponde esa semana
function suaveDe(week, ej) {
  const c = cuidadoDe(week, ej);
  if (c && c.tipo === "suave" && ej.suave && ej.suave !== "pausa") return ej.suave;
  return null;
}

function cacheKey(week, dia) { return `${week}-${dia}`; }
function getCheck(week, dia, id) { return sesionesCache[cacheKey(week, dia)]?.[id]?.check || false; }
function getPeso(week, dia, id) {
  const p = sesionesCache[cacheKey(week, dia)]?.[id]?.peso;
  return String(p ?? "").replace(/^'/, "");
}

function getFb(week, dia, id) { return sesionesCache[cacheKey(week, dia)]?.[id + "~fb"]?.peso || ""; }

function num(v) {
  const m = String(v ?? "").replace(",", ".").match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}

function fmtNum(n) { return String(Math.round(n * 100) / 100); }

function redondear(x, inc) { return Math.round(x / inc) * inc; }

// Lunes de una semana ISO, para medir la distancia entre semanas
function lunesDe(key) {
  const [y, w] = key.split("-W").map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const d = new Date(jan4);
  d.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (w - 1) * 7);
  return d;
}
function semanasEntre(a, b) { return Math.round((lunesDe(b) - lunesDe(a)) / (7 * 86400000)); }

function semanasPrevias(week) {
  return allWeeks.filter(w => w < week && w >= RUTINA_DESDE).sort().reverse().slice(0, 8);
}

async function loadPrevios(dia, week) {
  await Promise.all(semanasPrevias(week).map(w => loadSesion(w, dia)));
}

// Sesiones anteriores de un ejercicio con peso numérico, de la más nueva a la más vieja
function historialEj(week, dia, ej) {
  return semanasPrevias(week)
    .map(w => ({ week: w, n: num(getPeso(w, dia, ej.id)), check: getCheck(w, dia, ej.id), fb: getFb(w, dia, ej.id) }))
    .filter(h => h.n !== null && h.n > 0);
}

// Peso sugerido para hoy según lo que hiciste antes
function sugerencia(week, dia, ej) {
  const inc = INC[ej.id];
  if (!inc) return null;
  const suave = suaveDe(week, ej);
  const h = historialEj(week, dia, ej);
  const ultima = h[0] || null;

  if (suave) {
    const n = num(suave.pesoRef);
    return n ? { valor: fmtNum(n), flecha: "🩹", motivo: "semana suave", ultima } : null;
  }
  if (!ultima) {
    const n = num(ej.pesoRef);
    return n ? { valor: fmtNum(n), flecha: "", motivo: "peso de referencia, calibrá", ultima } : null;
  }

  const last = ultima.n, prev = h[1];
  const mismoAntes = prev && prev.n === last;
  let v = last, motivo = "repetí el peso";

  if (suaveDe(ultima.week, ej)) {
    const normal = num(ej.pesoRef) || last + inc;
    v = Math.min(normal, Math.max(last + inc, Math.floor((last + normal) / 2 / inc) * inc));
    motivo = "volviendo de la semana suave";
  } else if (semanasEntre(ultima.week, week) > 3) {
    motivo = "venís de un parate, repetí";
  } else if (ultima.fb === "facil") {
    v = last + inc; motivo = "la última te sobró";
  } else if (ultima.fb === "duro") {
    if (mismoAntes && prev.fb === "duro") { v = Math.max(inc, last - inc); motivo = "dos veces no llegaste, bajá un poco"; }
    else motivo = "no llegaste, repetí hasta completar";
  } else if (ultima.fb === "justo") {
    if (mismoAntes && prev.fb !== "duro") { v = last + inc; motivo = "2 sesiones con el mismo peso, subí"; }
    else motivo = "salió justo, repetí";
  } else if (mismoAntes && ultima.check && prev.check) {
    v = last + inc; motivo = "2 sesiones completas con el mismo peso, subí";
  }

  const flecha = v > last ? "⬆️" : v < last ? "⬇️" : "➡️";
  return { valor: fmtNum(v), flecha, motivo, ultima };
}

// Evita que la Sheet convierta "4-12" o "4/12" en una fecha
function pesoParaGuardar(v) {
  const t = String(v ?? "").trim();
  return /^\d{1,3}([.,]\d+)?\s*[-\/]\s*\d{1,3}([.,]\d+)?$/.test(t) ? "'" + t : t;
}

function getProgress(week, dia) {
  let total = 0, done = 0;
  RUTINA[dia].bloques.forEach(b => b.ejercicios.forEach(e => {
    if (pausaDe(week, e)) return;
    total++;
    if (getCheck(week, dia, e.id)) done++;
  }));
  return { total, done };
}

// Próximo día = el primer día de la semana que todavía no hiciste (menos de la mitad tildada)
function getProximoDia() {
  for (const d of DIAS) {
    const { total, done } = getProgress(currentWeek, d);
    if (done < Math.ceil(total / 2)) return { dia: d };
  }
  return { completa: true };
}

async function apiFetch(params) {
  const url = API + "?" + new URLSearchParams(params);
  const res = await fetch(url, { method: "GET", redirect: "follow" });
  return JSON.parse(await res.text());
}

async function apiPost(body) {
  const res = await fetch(API, {
    method: "POST",
    redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return JSON.parse(await res.text());
}

// Los guardados van de a uno (en fila) para que no se dupliquen filas en la Sheet
function guardar(body) {
  pendientes++;
  showSaving();
  saveChain = saveChain
    .then(() => apiPost(body))
    .catch(e => console.error("save error", e))
    .finally(() => { pendientes--; showSaving(); });
  return saveChain;
}

async function loadSesion(week, dia) {
  const k = cacheKey(week, dia);
  if (sesionesCache[k] !== undefined) return;
  sesionesCache[k] = {};
  try {
    const data = await apiFetch({ action: "getSesion", week, dia });
    sesionesCache[k] = data || {};
  } catch (e) { console.error("loadSesion error", e); }
}

async function loadSemana(week) {
  await Promise.all(DIAS.map(d => loadSesion(week, d)));
}

function showSaving() {
  const el = document.getElementById("saving-indicator");
  if (el) el.textContent = pendientes > 0 ? "GUARDANDO..." : "";
}

function render() {
  document.getElementById("app").innerHTML = buildApp();
}

function buildApp() {
  const p = getProximoDia();
  const box = p.completa
    ? `<div class="next-day-box"><div class="next-label">SEMANA</div><div class="next-name">✓ COMPLETA</div></div>`
    : `<div class="next-day-box"><div class="next-label">⚡ TE TOCA</div><div class="next-name">${RUTINA[p.dia].emoji} ${DIAS_LABEL[p.dia]}</div></div>`;
  return `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="logo-title">GUS</div>
          <div class="logo-sub">TRAINING LOG</div>
        </div>
        <div style="text-align:right">
          <div class="saving-indicator" id="saving-indicator">${pendientes > 0 ? "GUARDANDO..." : ""}</div>
          ${box}
        </div>
      </div>
      <div class="vista-tabs">
        <button class="vista-tab ${vista === 'rutina' ? 'active' : ''}" onclick="switchVista('rutina')">📋 Rutina</button>
        <button class="vista-tab ${vista === 'historial' ? 'active' : ''}" onclick="switchVista('historial')">📊 Historial</button>
      </div>
    </div>
    ${vista === 'rutina' ? buildRutina() : buildHistorial()}
    <div class="pb-safe"></div>
  `;
}

function buildEjercicio(ej, isCurrentWeek) {
  const pausa = pausaDe(semanaActiva, ej);
  const suave = suaveDe(semanaActiva, ej);
  const v = suave || ej;
  const ssBadge = (ej.ss ? `<span class="ss-badge">SS ${ej.ss}</span>` : '') + (suave ? '<span class="ss-badge suave-badge">SUAVE</span>' : '');
  const meta = `<div class="ej-meta"><span class="ej-meta-accent">${v.series} series</span> · ${v.reps}<span class="ej-ref">ref: ${v.pesoRef}${suave ? ` (normal: ${ej.pesoRef})` : ''}</span></div>`;

  if (pausa) {
    return `
      <div class="ej-card pausado">
        <div class="ej-inner">
          <div class="pausa-icon">⏸</div>
          <div class="ej-body">
            <div class="ej-nombre">${ej.nombre}${ssBadge}</div>
            ${meta}
            <div class="pausa-txt">En pausa esta semana (${pausa.motivo})</div>
          </div>
        </div>
      </div>`;
  }

  const checked = getCheck(semanaActiva, diaActivo, ej.id);
  const peso = getPeso(semanaActiva, diaActivo, ej.id);
  const sug = isCurrentWeek ? sugerencia(semanaActiva, diaActivo, ej) : null;
  const fb = getFb(semanaActiva, diaActivo, ej.id);

  let sugHtml = '';
  if (sug) {
    const u = sug.ultima;
    const ultimaTxt = u ? `Última vez: <b>${fmtNum(u.n)}</b> · ${formatWeekLabel(u.week)}${u.fb ? ' ' + FB[u.fb].emoji : ''}` : 'Primera vez con este ejercicio';
    sugHtml = `
      <div class="sug">
        <div class="sug-ultima">${ultimaTxt}</div>
        <div class="sug-row">
          <span>Hoy: <b class="sug-val">${sug.valor}</b> ${sug.flecha} <span class="sug-motivo">${sug.motivo}</span></span>
          ${peso !== sug.valor ? `<button class="sug-btn" onclick="usarSugerencia('${ej.id}', '${sug.valor}')">Usar</button>` : ''}
        </div>
      </div>`;
  }

  const fbHtml = (checked && isCurrentWeek && INC[ej.id]) ? `
    <div class="fb-row">
      <span class="fb-label">¿Cómo te fue?</span>
      ${Object.entries(FB).map(([k, f]) => `<button class="fb-btn ${fb === k ? 'sel' : ''}" onclick="setFb('${ej.id}', '${k}')">${f.emoji} ${f.txt}</button>`).join('')}
    </div>` : '';

  return `
    <div class="ej-card ${checked ? 'done' : ''}">
      <div class="ej-inner">
        <button class="check-box ${checked ? 'done' : ''}" ${!isCurrentWeek ? 'disabled' : ''} onclick="toggleCheck('${ej.id}')">
          ${checked ? '✓' : ''}
        </button>
        <div class="ej-body">
          <div class="ej-nombre ${checked ? 'done' : ''}">${ej.nombre}${ssBadge}</div>
          ${meta}
          ${ej.nota ? `<div class="ej-nota">⚠️ ${ej.nota}</div>` : ''}
          ${suave ? `<div class="ej-nota">🩹 Sin llegar al fallo. Si molesta en dorsal u omóplato, cortás.</div>` : ''}
          ${sugHtml}
          <div class="peso-row">
            <span class="peso-label">Peso:</span>
            <input class="peso-input" placeholder="${isCurrentWeek ? (sug ? sug.valor : 'ej: 20') : '—'}"
              value="${esc(peso)}" ${!isCurrentWeek ? 'disabled' : ''}
              onchange="updatePeso('${ej.id}', this.value)">
          </div>
          ${fbHtml}
        </div>
      </div>
    </div>`;
}

function buildRutina() {
  const isCurrentWeek = semanaActiva === currentWeek;
  const dia = RUTINA[diaActivo];
  const { total, done } = getProgress(semanaActiva, diaActivo);
  const pct = total > 0 ? (done / total) * 100 : 0;

  const cuidadosDia = [];
  dia.bloques.forEach(b => b.ejercicios.forEach(e => {
    const c = cuidadoDe(semanaActiva, e);
    if (c && !cuidadosDia.includes(c)) cuidadosDia.push(c);
  }));
  const bannerPausa = cuidadosDia.map(c => c.tipo === "suave"
    ? `<div class="banner pausa">🩹 Semana de vuelta con cuidado: ${c.zona} en modo suave (${c.motivo}). Pesos más bajos, movimiento lento y sin dolor. Lo que está en ⏸ no se hace esta semana.</div>`
    : `<div class="banner pausa">⏸ Esta semana sin ${c.zona} (${c.motivo}). Hacé solo los ejercicios activos, sin superserie, y con el descanso indicado.</div>`
  ).join('');

  const semanaBtns = allWeeks.slice(0, 5).map(w => `
    <button class="semana-btn ${semanaActiva === w ? 'active' : ''}" onclick="switchSemana('${w}')">
      ${w === currentWeek ? 'Esta semana' : formatWeekLabel(w)}
    </button>`).join('');

  const diaTabs = DIAS.map(d => {
    const { total: t, done: dn } = getProgress(semanaActiva, d);
    return `<button class="dia-tab ${diaActivo === d ? 'active' : ''}" onclick="switchDia('${d}')">
      ${DIAS_LABEL[d]}
      <span class="dia-tab-count ${dn > 0 && dn === t ? 'completo' : ''}">${dn > 0 ? dn + '/' + t : ' '}</span>
    </button>`;
  }).join('');

  const bloques = dia.bloques.map(bloque => `
    <div class="bloque">
      <div class="bloque-title">${bloque.nombre}</div>
      ${bloque.ejercicios.map(ej => buildEjercicio(ej, isCurrentWeek)).join('')}
    </div>`).join('');

  return `
    <div class="semana-bar">
      <span class="semana-label">SEMANA:</span>${semanaBtns}
    </div>
    <div class="dia-tabs">${diaTabs}</div>
    <div class="content">
      <div class="dia-header">
        <div><span style="font-size:26px;margin-right:8px">${dia.emoji}</span><span class="dia-title">${dia.label}</span></div>
        <span class="dia-count ${pct === 100 ? 'completo' : ''}">${done}/${total}</span>
      </div>
      ${!isCurrentWeek ? '<div class="banner">📖 Modo lectura — semana pasada</div>' : ''}
      ${bannerPausa}
      <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${bloques}
    </div>`;
}

function buildHistorial() {
  const semanas = allWeeks.filter(w => w === currentWeek || DIAS.some(d =>
    RUTINA[d].bloques.some(b => b.ejercicios.some(e => sesionesCache[cacheKey(w, d)]?.[e.id]))
  ));
  if (semanas.length === 0) return `<div class="content"><div class="empty-msg">Acá vas a ver el historial una vez que empieces a registrar.</div></div>`;
  const cards = semanas.map(week => {
    const diasHtml = DIAS.map(dia => {
      const { total, done } = getProgress(week, dia);
      const pct = total > 0 ? (done / total) * 100 : 0;
      const sesion = sesionesCache[cacheKey(week, dia)] || {};
      let rows = '';
      RUTINA[dia].bloques.forEach(b => b.ejercicios.forEach(ej => {
        const d = sesion[ej.id];
        if (!d) return;
        const peso = String(d.peso ?? "").replace(/^'/, "");
        const nombre = ej.nombre.length > 35 ? ej.nombre.substring(0, 35) + '…' : ej.nombre;
        rows += `<div class="hist-peso-row">
          <span class="hist-peso-nombre" style="${d.check ? 'text-decoration:line-through' : ''}">${nombre}</span>
          <span class="hist-peso-val">${esc(peso) || (d.check ? '✓' : '—')}${sesion[ej.id + '~fb'] ? ' ' + (FB[sesion[ej.id + '~fb'].peso]?.emoji || '') : ''}</span>
        </div>`;
      }));
      return `<div style="margin-bottom:12px">
        <div class="hist-dia-label">
          <span>${RUTINA[dia].emoji} ${DIAS_LABEL[dia]} · ${RUTINA[dia].label}</span>
          <span class="hist-dia-done ${done === total && total > 0 ? 'completo' : ''}">${done}/${total}${done === total && total > 0 ? ' ✓' : ''}</span>
        </div>
        <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${rows ? `<div class="hist-pesos">${rows}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="hist-card">
      <div class="hist-week-label ${week === currentWeek ? 'current' : ''}">${week === currentWeek ? '⚡ Esta semana' : formatWeekLabel(week)}</div>
      <div class="hist-week-key">${week}</div>
      ${diasHtml}
    </div>`;
  }).join('');
  return `<div class="content"><div class="hist-title">📊 HISTORIAL</div>${cards}</div>`;
}

async function switchVista(v) {
  vista = v;
  if (v === 'historial') await Promise.all(allWeeks.slice(0, 8).map(loadSemana));
  render();
}

async function switchSemana(w) {
  semanaActiva = w;
  await Promise.all([loadSemana(w), loadPrevios(diaActivo, w)]);
  render();
}

async function switchDia(d) {
  diaActivo = d;
  await Promise.all([loadSesion(semanaActiva, d), loadPrevios(d, semanaActiva)]);
  render();
}

function buscarEj(dia, id) {
  for (const b of RUTINA[dia].bloques) for (const e of b.ejercicios) if (e.id === id) return e;
  return null;
}

function usarSugerencia(ejId, valor) {
  updatePeso(ejId, valor);
  render();
}

function setFb(ejId, val) {
  const k = cacheKey(semanaActiva, diaActivo);
  if (!sesionesCache[k]) sesionesCache[k] = {};
  const actual = sesionesCache[k][ejId + "~fb"]?.peso;
  const nuevo = actual === val ? "" : val;
  sesionesCache[k][ejId + "~fb"] = { check: !!nuevo, peso: nuevo };
  render();
  guardar({ week: semanaActiva, dia: diaActivo, ejercicioId: ejId + "~fb", check: !!nuevo, peso: nuevo });
}

function toggleCheck(ejId) {
  const current = getCheck(semanaActiva, diaActivo, ejId);
  let peso = getPeso(semanaActiva, diaActivo, ejId);
  // Si tildás sin cargar peso, se guarda el sugerido
  if (!current && !peso) {
    const ej = buscarEj(diaActivo, ejId);
    const sug = ej ? sugerencia(semanaActiva, diaActivo, ej) : null;
    if (sug) peso = sug.valor;
  }
  const k = cacheKey(semanaActiva, diaActivo);
  if (!sesionesCache[k]) sesionesCache[k] = {};
  sesionesCache[k][ejId] = { check: !current, peso };
  render();
  guardar({ week: semanaActiva, dia: diaActivo, ejercicioId: ejId, check: !current, peso: pesoParaGuardar(peso) });
}

function updatePeso(ejId, valor) {
  const check = getCheck(semanaActiva, diaActivo, ejId);
  const k = cacheKey(semanaActiva, diaActivo);
  if (!sesionesCache[k]) sesionesCache[k] = {};
  sesionesCache[k][ejId] = { check, peso: valor };
  guardar({ week: semanaActiva, dia: diaActivo, ejercicioId: ejId, check, peso: pesoParaGuardar(valor) });
}

async function init() {
  currentWeek = getWeekKey();
  semanaActiva = currentWeek;
  try {
    const weeks = await apiFetch({ action: "getAllWeeks" });
    allWeeks = Array.isArray(weeks) ? weeks : [];
    if (!allWeeks.includes(currentWeek)) allWeeks.unshift(currentWeek);
    await loadSemana(currentWeek);
    await Promise.all(DIAS.map(d => loadPrevios(d, currentWeek)));
  } catch (e) {
    console.error("init error", e);
    document.getElementById("loading").innerHTML = '<div class="error-msg">❌ Error conectando con Google Sheets.<br><br>Revisá tu conexión e intentá de nuevo.</div>';
    return;
  }
  const p = getProximoDia();
  if (p.dia) diaActivo = p.dia;
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

init();
</script>
